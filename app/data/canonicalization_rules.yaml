  # ─── Sinónimos regionales AR↔ES (uso ibérico en OFF taxonomy) ───
  # OFF a veces tiene el ingrediente solo bajo el nombre ibérico; agregamos
  # los argentinos como alias para que el lookup multilingüe matchee.
  #
  # CRITICO: 'manteca' en OFF apunta a en:fat (grasa genérica) por uso
  # ibérico, pero en Argentina manteca=mantequilla (lácteo). Sin este alias
  # un producto con manteca quedaría APTO sin_lactosa por error.
  manteca:
    canonical: mantequilla
    name_en: butter
    reason: manteca (AR) = mantequilla (lacteo); OFF mapea manteca a grasa genérica
  arveja:
    canonical: guisante
    name_en: pea
    reason: arveja (AR) = guisante (ES); OFF indexa solo el ibero
  arvejas:
