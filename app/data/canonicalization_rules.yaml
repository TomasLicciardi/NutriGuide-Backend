# Reglas de canonicalizacion de ingredientes.
#
# Objetivo: resolver variantes de etiqueta hacia una entidad canonica antes de
# consultar KB/OFF, sin meter reglas por producto ni por foto.
#
# Las claves se comparan normalizadas: minusculas, sin acentos, espacios
# compactados.

