patterns:
  # IMPORTANTE: no matchea "leche de coco/almendras/soja" porque los
  # calificadores estan en lista cerrada (no incluye "de <planta>").
  - id: milk_variants
    pattern: "^leche(?:\\s+(?:entera|descremada|desnatada|semidescremada|parcialmente\\s+descremada|en\\s+polvo|pasteurizad[oa]s?|uht|larga\\s+vida|fluida))+$"
    canonical: leche
    name_en: milk
    reason: variedad/forma fisica de leche sin cambio de alergenos

  - id: enriched_wheat_flour_argentina
    pattern: "^harina(?:\\s+de)?\\s+trigo(?:\\s+(?:tipo\\s*)?0{3,4})?\\s+enriquecida(?:\\s+(?:segun\\s+)?ley\\s*25[\\.]?630)?$"
    canonical: harina enriquecida
    name_en: enriched wheat flour
    reason: harina enriquecida argentina por Ley 25.630

  - id: wheat_semolina
    pattern: "^semola\\s+de\\s+trigo(?:\\s+candeal)?$"
    canonical: harina enriquecida
    name_en: wheat semolina
    reason: semola de trigo contiene gluten

  - id: tomato_derivatives
    pattern: "^(?:concentrado\\s+doble\\s+de\\s+tomate|extracto\\s+de\\s+tomate|tomate\\s+pelado(?:s)?)$"
    canonical: tomate
    name_en: tomato
    reason: derivado de tomate sin cambio de alergenos

  - id: cheese_variety
    pattern: "^queso(?!\\s+(?:vegano|vegetal|de\\s+(?:soja|almendra|castana|castanas|caju|mani))).+$"
    canonical: queso
    name_en: cheese
    reason: variedad de queso lacteo

  - id: caramel_roman_class
    pattern: "^caramelo\\s+(?:i|ii|iii|iv|1|2|3|4)$"
    canonical: caramelo
    name_en: caramel color
    reason: clase de color caramelo

  - id: concentrated_juice
    pattern: "^jugo\\s+(?:concentrado\\s+de|de)\\s+(.+?)(?:\\s+deshidratado)?$"
    canonical_template: "jugo de {1}"
    candidate_templates:
      - "jugo de {1}"
      - "{1}"
    name_en_template: "{1} juice"
    reason: jugo de fruta concentrado/deshidratado

  - id: powdered_ingredient
    pattern: "^(.+?)\\s+en\\s+polvo$"
    canonical_template: "{1}"
    candidate_templates:
      - "{1}"
    reason: forma fisica en polvo no cambia alergenos

  - id: processing_state_suffix
    pattern: "^(.+?)\\s+(?:pasteurizad[oa]s?|refinad[oa]s?|deshidratad[oa]s?|tostad[oa]s?|pelad[oa]s?|molid[oa]s?|trozad[oa]s?|picad[oa]s?|rallad[oa]s?|cocid[oa]s?|rehidratad[oa]s?)$"
    canonical_template: "{1}"
    candidate_templates:
      - "{1}"
    reason: estado/proceso no cambia identidad base
