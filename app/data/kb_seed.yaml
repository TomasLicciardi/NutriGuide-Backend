# kb_seed.yaml
# Datos curados para pre-cargar la Knowledge Base (Tier 2) al startup.
#
# Estos ingredientes se insertan en la tabla `ingredients` si no existen,
# con resolved_by="seed" y confianza 0.95 (alta, pero menor que Tier 1).
#
# Ventaja sobre hardcoding:
#   - Se resuelven por el Tier 2 (KB), no por código
#   - Pueden ser sobrescritos si un Tier 3+ encuentra mejor información
#   - Son visibles, auditables y editables sin tocar código
#   - Demuestran que el pipeline funciona desde el arranque

# ══════════════════════════════════════════════════════════════════════
