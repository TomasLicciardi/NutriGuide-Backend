apiVersion: v1
kind: ConfigMap
metadata:
  name: nutriguide-config
  namespace: tomaslicciardi-dev
data:
  # Backend
  DATABASE_PATH: "/app/db"   # el volumen; /app/data lo trae la imagen (OFF taxonomy)
  DATABASE_NAME: "nutriguide.db"
  JWT_ACCESS_TOKEN_EXPIRES: "3600"
  GEMINI_VISION_MODEL: "gemini-3.5-flash-lite"
  GEMINI_MODEL_FALLBACKS: "gemini-2.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash"
  GEMINI_RPM_LIMIT: "12"
  LLM_FALLBACK_ENABLED: "true"
  PORT: "8000"

  # Admin (acepta la DB en otra ruta porque comparte el PVC pero monta en /data)
  ADMIN_DATABASE_PATH: "/data/nutriguide.db"
  ADMIN_PORT: "8001"
