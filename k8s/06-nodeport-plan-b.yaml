# Plan B: NodePort para acceder directo por IP del nodo.
#
# Usar cuando el Ingress no funciona, no tenemos un controller disponible,
# o queremos hacer pruebas rápidas sin DNS.
#
# Acceso:
#   http://10.201.2.138:30080/         ← backend
#   http://10.201.2.138:30081/         ← admin
#
# Si UM Cloud tiene otro nodo con otra IP, usar la IP de ese nodo en lugar
# de la IP de la VM de gestión.
#
# Aplicar con:
#   kubectl apply -f 06-nodeport-plan-b.yaml
#
# Si después arreglás el Ingress y querés volver a ClusterIP solamente,
# eliminar estos services o cambiar type a ClusterIP.

apiVersion: v1
kind: Service
metadata:
  name: nutriguide-backend-nodeport
  namespace: tomaslicciardi-dev
  labels:
    app: nutriguide
    component: backend
    exposure: nodeport
spec:
  type: NodePort
  selector:
    app: nutriguide
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080   # rango válido en K8s: 30000-32767

---
apiVersion: v1
kind: Service
metadata:
  name: nutriguide-admin-nodeport
  namespace: tomaslicciardi-dev
  labels:
    app: nutriguide
    component: admin
    exposure: nodeport
spec:
  type: NodePort
  selector:
    app: nutriguide
  ports:
    - name: http
      port: 80
      targetPort: 8001
      nodePort: 30081
